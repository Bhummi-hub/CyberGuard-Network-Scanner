<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: { dark: '#0a0d14', card: '#111625', border: '#1f293d', accent: '#00f0ff' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['Fira Code', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        body { background-color: #060910; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glow-accent { box-shadow: 0 0 20px rgba(0, 240, 255, 0.2); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-[#111625] border border-slate-800 rounded-2xl p-8 glow-accent space-y-6">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-2">
            <div class="inline-flex p-3 bg-cyan-950/60 border border-cyan-500/40 rounded-2xl text-cyan-400 mb-2">
                <i class="fa-solid fa-shield-halved text-2xl"></i>
            </div>
            <h1 class="font-bold text-xl tracking-wide bg-gradient-to-r from-cyan-400 via-teal-300 to-emerald-400 bg-clip-text text-transparent">CYBER<span class="text-white">GUARD</span></h1>
            <p class="text-xs text-slate-400 font-mono">Secure Access Terminal</p>
        </div>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-mono text-center">
              {% for message in messages %}
                <p>{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form method="POST" action="/login" class="space-y-4">
            <div class="space-y-1">
                <label class="text-xs font-mono text-slate-400">Username</label>
                <input type="text" name="username" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-xs font-mono text-cyan-400 focus:outline-none focus:border-cyan-500 transition">
            </div>
            <div class="space-y-1">
                <label class="text-xs font-mono text-slate-400">Password</label>
                <input type="password" name="password" required class="w-full bg-slate-900/80 border border-slate-800 rounded-xl px-4 py-3 text-xs font-mono text-cyan-400 focus:outline-none focus:border-cyan-500 transition">
            </div>
            <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 to-teal-500 hover:from-cyan-400 hover:to-teal-400 text-black font-bold text-xs tracking-wider font-mono uppercase transition shadow-lg mt-2">
                AUTHENTICATE SESSION
            </button>
        </form>

        <!-- Footer link -->
        <div class="text-center text-xs text-slate-400 pt-2 border-t border-slate-800">
            Don't have an account? <a href="/signup" class="text-cyan-400 hover:underline font-medium">Sign up</a>
        </div>
    </div>
</body>
</html>
